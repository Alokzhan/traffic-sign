services:
  - type: web
    name: traffic-sign-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: cd frontend && uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: OUT_DIR
        value: /opt/render/project/src/outputs

  - type: web
    name: traffic-sign-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
